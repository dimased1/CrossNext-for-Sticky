STR_PET_STORY_0: "Семечко"
STR_PET_STORY_TEXT_0: "Вы дочитываете главу. Рядом с питомцем проросло крошечное семечко. Вы поставили его у окна."
STR_PET_STORY_1: "Дождливый день"
STR_PET_STORY_TEXT_1: "Пока вы читаете, по стеклу стучит дождь. Питомец свернулся клубком. Комната кажется самым уютным убежищем."
STR_PET_STORY_2: "Гость"
STR_PET_STORY_TEXT_2: "У окна присела птица. Питомец тихо наблюдает за ней. Вы улыбаетесь и закладываете страницу."
