STR_PET_STORY_4: "Под звёздами"
STR_PET_STORY_TEXT_4: "После чтения вы вместе смотрите в окно. Загорается первая звезда, затем вторая. Впереди ещё столько открытий."
STR_PET_STORY_5: "Потерянный листик"
STR_PET_STORY_TEXT_5: "Питомец принёс вам листок. Вы кладёте его рядом с закладкой — маленький подарок обычного дня."
STR_PET_STORY_6: "Уютный уголок"
STR_PET_STORY_TEXT_6: "Вы нашли удобное кресло и открыли книгу. Питомец устроился рядом. Никто из вас никуда не спешит."
STR_PET_STORY_7: "Новая тропа"
STR_PET_STORY_TEXT_7: "Ещё одна страница ведёт в новые края. Питомец потягивается и готов к завтрашней главе."
