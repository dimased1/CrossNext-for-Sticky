STR_CAR_HELP_TEXT: "КАК РАСКРЫТЬ ДЕЛО\nКаждый персонаж делает одно заявление. Вверху экрана указано точное число виновников и лживых фраз. Найдите комбинацию, удовлетворяющую обоим числам. У каждого дела строго одно решение.\n\nВИНА НЕ РАВНА ЧЕСТНОСТИ\nНевиновный может солгать, а виновник — сказать правду. «2 лжи» означает, что ровно два полных высказывания ложны, остальные истинны.\n\nЧТЕНИЕ УЛИК\n«А или Б (или оба)» означает, что хотя бы один виновен. «А и Б» требует вины обоих. Ложь опровергает всю фразу целиком.\n\nРОСТ И ДИЕТА\nФакты роста и рациона всегда правдивы. Высказывания могут быть ложью."

