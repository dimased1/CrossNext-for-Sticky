STR_INTERCEPT_TITLE_0: "БАРАК 14"
STR_INTERCEPT_TEXT_0: "Блетчли-Парк, 1942 год. Вас держат взаперти за закрытой дверью. Исчезла деталь счётной машины. Утренний радиоперехват шуршит в кармане пальто. За дверью смолкают шаги."
STR_INTERCEPT_CHOICE_0_0: "Обдумать обвинение"
STR_INTERCEPT_CHOICE_0_1: "Ждать следователя"
STR_INTERCEPT_CHOICE_0_2: "Обыскать карманы пальто"
STR_INTERCEPT_TITLE_1: "ОБВИНЕНИЕ"
STR_INTERCEPT_TEXT_1: "Вас подозревают в измене. Вы зарабатываете на жизнь разгадкой шифров, кроссвордов и шахматных этюдов. Эта комната — очередная задача: оговоритесь, и доверие рухнет первым."
STR_INTERCEPT_CHOICE_1_0: "Выбрать стратегию"
STR_INTERCEPT_CHOICE_1_1: "Выслушать, что им известно"
STR_INTERCEPT_TITLE_2: "ПРИХОД ХАРРИСА"
STR_INTERCEPT_TEXT_2: "Входит Харрис с чашкой чая и папкой. На «Бомбе» не хватает барабана. В журнале дежурств значится ваша фамилия. Он ставит чай на стол и спрашивает, где вы были ночью."
STR_INTERCEPT_CHOICE_2_0: "Выпить чай"
STR_INTERCEPT_CHOICE_2_1: "Оставить чай нетронутым"
STR_INTERCEPT_CHOICE_2_2: "Отвечать спокойно"
STR_INTERCEPT_TITLE_3: "ДЕТАЛЬ"
STR_INTERCEPT_TEXT_3: "Во внутреннем кармане пальто пальцы нащупывают холодный металл. Барабан на месте. Хупер клялся, что кража прекратит шантаж. Теперь запертая дверь обретает совсем иной смысл."
STR_INTERCEPT_CHOICE_3_0: "Прятать деталь"
STR_INTERCEPT_CHOICE_3_1: "Отдать её Харрису"
STR_INTERCEPT_TITLE_4: "ВЕРНЫЙ ХОД"
STR_INTERCEPT_TEXT_4: "Сотрудничество может спасти репутацию. Убедительная ложь выиграет время. Побег сменит запертую комнату на часовых снаружи. Ни один из этих ходов нельзя будет отменить."
STR_INTERCEPT_CHOICE_4_0: "Сотрудничать со следствием"
STR_INTERCEPT_CHOICE_4_1: "Придумать алиби"
STR_INTERCEPT_CHOICE_4_2: "Осмотреть окно"
STR_INTERCEPT_TITLE_5: "ЧАЙ"
STR_INTERCEPT_TEXT_5: "Комната кренится. Харрис замечает молчание, но его силуэт уже уплывает в туман. Когда вы снова открываете глаза, у стола стоит пара других ботинок."
STR_INTERCEPT_CHOICE_5_0: "Притвориться спящим"
STR_INTERCEPT_CHOICE_5_1: "Заговорить с визитёром"
STR_INTERCEPT_CHOICE_5_2: "Попросить воды"
STR_INTERCEPT_TITLE_6: "ТИХИЙ ОТКАЗ"
STR_INTERCEPT_TEXT_6: "Вы отодвигаете чашку. Харрис следит за движением пристальнее, чем за ответом. Он спрашивает, не стоит ли ему допросить кого-то ещё."
STR_INTERCEPT_CHOICE_6_0: "Спросить об уликах"
STR_INTERCEPT_CHOICE_6_1: "Упомянуть Хупера"
STR_INTERCEPT_CHOICE_6_2: "Посмотреть на окно"
STR_INTERCEPT_TITLE_7: "ПРОПАВШИЙ БАРАБАН"
STR_INTERCEPT_TEXT_7: "Харрис требует прямого ответа: вы взяли деталь? Можно выложить её, рассказать о давлении Хупера или попытаться отвести подозрение в сторону."
STR_INTERCEPT_CHOICE_7_0: "Отдать ему барабан"
STR_INTERCEPT_CHOICE_7_1: "Рассказать о шантаже"
STR_INTERCEPT_CHOICE_7_2: "Обвинить Хупера"
STR_INTERCEPT_TITLE_8: "МЕТАЛЛ НА СТОЛЕ"
STR_INTERCEPT_TEXT_8: "Деталь ложится между вами. Харрис проверяет маркировку, не теряя настороженности. Возврат детали не объясняет мотивов. Ему нужны факты, а не слова."
STR_INTERCEPT_CHOICE_8_0: "Предложить найти улики"
STR_INTERCEPT_CHOICE_8_1: "Остаться и отвечать"
STR_INTERCEPT_TITLE_9: "АЛИБИ"
STR_INTERCEPT_TEXT_9: "Вы описываете тихий вечер за рабочим столом. Харрис открывает папку. Часовой видел, как вы выходили из машинного зала. Против вашей выдумки есть свидетель."
STR_INTERCEPT_CHOICE_9_0: "Защищать свою версию"
STR_INTERCEPT_CHOICE_9_1: "Признаться в шантаже"
STR_INTERCEPT_CHOICE_9_2: "Отказаться отвечать"
STR_INTERCEPT_TITLE_10: "ОКНО"
STR_INTERCEPT_TEXT_10: "Окно расположено высоко, стекло толстое. За ним тропа ведёт мимо соседнего барака. Разбить стекло — слишком шумно; оставаться здесь — не менее опасно."
STR_INTERCEPT_CHOICE_10_0: "Разбить стекло"
STR_INTERCEPT_CHOICE_10_1: "Изучить тропу за окном"
STR_INTERCEPT_CHOICE_10_2: "Вернуться к допросу"
STR_INTERCEPT_TITLE_11: "ДРУГОЙ ГОСТЬ"
STR_INTERCEPT_TEXT_11: "Пока вы приходите в себя, заходит Хупер. Он хочет знать, у Харриса ли деталь, и держит руку возле дверной ручки."
STR_INTERCEPT_CHOICE_11_0: "Притвориться спящим"
STR_INTERCEPT_CHOICE_11_1: "Потребовать объяснений"
STR_INTERCEPT_CHOICE_11_2: "Попросить воды"
STR_INTERCEPT_TITLE_12: "ПРЕДОСТЕРЕЖЕНИЕ"
STR_INTERCEPT_TEXT_12: "Вы зовёте Харриса, пока действие чая не усилилось. Он возвращается с раздражением. Обвинение насчёт чая потребует вещественных доказательств."
STR_INTERCEPT_CHOICE_12_0: "Сохранить чашку как улику"
STR_INTERCEPT_CHOICE_12_1: "Обвинить Харриса в отравлении"
STR_INTERCEPT_CHOICE_12_2: "Говорить о барабане"
STR_INTERCEPT_TITLE_13: "ХУПЕР"
STR_INTERCEPT_TEXT_13: "Харрис знает эту фамилию. Хупер полезен, со связями, и тоже был в ночном графике. Но знакомство — ещё не доказательство вины."
STR_INTERCEPT_CHOICE_13_0: "Найти проверяемый факт"
STR_INTERCEPT_CHOICE_13_1: "Настаивать на вине Хупера"
STR_INTERCEPT_TITLE_14: "ШАНТАЖ"
STR_INTERCEPT_TEXT_14: "Вы рассказываете о предательстве доверия и последовавших угрозах. Харрис слушает бесстрастно. Назвав имя кукловода, вы рискуете выдать того, кого пытались защитить."
STR_INTERCEPT_CHOICE_14_0: "Рассказать всё без утайки"
STR_INTERCEPT_CHOICE_14_1: "Умолчать имена"
STR_INTERCEPT_CHOICE_14_2: "Предложить поймать Хупера"
STR_INTERCEPT_TITLE_15: "ЛЕГКОВЕСНОЕ ОБВИНЕНИЕ"
STR_INTERCEPT_TEXT_15: "Вы утверждаете, что виновен Хупер. Харрис спрашивает, откуда вам это известно. Разгадать загадку и предоставить свидетеля — разные вещи."
STR_INTERCEPT_CHOICE_15_0: "Дать Харрису проверить версию"
STR_INTERCEPT_CHOICE_15_1: "Передать записку Хуперу"
STR_INTERCEPT_TITLE_16: "ПРОВЕРЯЕМАЯ ЗАЦЕПКА"
STR_INTERCEPT_TEXT_16: "Слова можно опровергнуть. Документ, свидетель или пропавшая деталь — куда более веские улики. У вас мало времени на выбор цели."
STR_INTERCEPT_CHOICE_16_0: "Осмотреть соседний барак"
STR_INTERCEPT_CHOICE_16_1: "Использовать перехват"
STR_INTERCEPT_CHOICE_16_2: "Спросить Хупера напрямую"
STR_INTERCEPT_TITLE_17: "НЕ ПРОСТО ВОЗВРАТ"
STR_INTERCEPT_TEXT_17: "Машину можно запустить, но перед Харрисом стоит вопрос о бреши в безопасности. Он даёт последний шанс назвать организатора."
STR_INTERCEPT_CHOICE_17_0: "Показать улики"
STR_INTERCEPT_CHOICE_17_1: "Искать доказательства"
STR_INTERCEPT_CHOICE_17_2: "Принять его решение"
STR_INTERCEPT_TITLE_18: "ПРОТИВОРЕЧИЕ"
STR_INTERCEPT_TEXT_18: "Харрис кладёт ваш первый ответ рядом с последним. Они исключают друг друга. Можно признать обман или позволить допросу закончиться на лжи."
STR_INTERCEPT_CHOICE_18_0: "Сказать правду о шантаже"
STR_INTERCEPT_CHOICE_18_1: "Продолжать всё отрицать"
STR_INTERCEPT_CHOICE_18_2: "Попытаться уйти"
STR_INTERCEPT_TITLE_19: "МОЛЧАНИЕ"
STR_INTERCEPT_TEXT_19: "Вы скрещиваете руки. Харрис закрывает папку. Здесь молчание не останавливает следствие — оно лишь лишает вас права голоса."
STR_INTERCEPT_CHOICE_19_0: "Выслушать вердикт"
STR_INTERCEPT_TITLE_20: "РАЗБИТОЕ СТЕКЛО"
STR_INTERCEPT_TEXT_20: "Стекло поддаётся с треском. В комнату врываются холодный воздух и свисток часового. До прихода охраны остаётся сделать один выбор."
STR_INTERCEPT_CHOICE_20_0: "Бежать к внешней тропе"
STR_INTERCEPT_CHOICE_20_1: "Оставить шифрованную подсказку"
STR_INTERCEPT_CHOICE_20_2: "Остаться и объяснить всё"
STR_INTERCEPT_TITLE_21: "МЕЖДУ БАРАКАМИ"
STR_INTERCEPT_TEXT_21: "Тропа размокла от дождя. До барака Хупера можно добежать до смены патруля, но открытое поле за ним сулит иной шанс."
STR_INTERCEPT_CHOICE_21_0: "Попытаться покинуть базу"
STR_INTERCEPT_CHOICE_21_1: "Войти в барак Хупера"
STR_INTERCEPT_CHOICE_21_2: "Вернуться к Харрису"
STR_INTERCEPT_TITLE_22: "ТАЙНАЯ ПАРТИЯ"
STR_INTERCEPT_TEXT_22: "Хупер изучает вас. На столе он пальцами расставляет воображаемую шахматную позицию. Тонкий намёк может заставить его выдать тайну."
STR_INTERCEPT_CHOICE_22_0: "Ответить шахматным ходом"
STR_INTERCEPT_CHOICE_22_1: "Пригрозить раскрыть его"
STR_INTERCEPT_CHOICE_22_2: "Говорить начистоту"
STR_INTERCEPT_TITLE_23: "ЛИЦОМ К ЛИЦУ"
STR_INTERCEPT_TEXT_23: "Хупер с усмешкой спрашивает, что именно вы можете доказать. Его уверенность тает лишь при упоминании деталей, известных лишь заговорщикам."
STR_INTERCEPT_CHOICE_23_0: "Предъявить доказательства"
STR_INTERCEPT_CHOICE_23_1: "Предложить сделку с деталью"
STR_INTERCEPT_CHOICE_23_2: "Блефовать"
STR_INTERCEPT_TITLE_24: "ЧАШКА"
STR_INTERCEPT_TEXT_24: "Хупер приносит воду, но первым делом тянется к чашке из-под чая. Оставить эту чашку у себя полезнее, чем принять любое его предложение."
STR_INTERCEPT_CHOICE_24_0: "Удержать чашку"
STR_INTERCEPT_CHOICE_24_1: "Снова проверить пальто"
STR_INTERCEPT_TITLE_25: "ВЕЩЕСТВЕННАЯ УЛИКА"
STR_INTERCEPT_TEXT_25: "Вы не отдаёте чашку и требуете экспертизы. Наконец у обвинения появляется материальный след, а спешка Хупера лишь подтверждает подозрения."
STR_INTERCEPT_CHOICE_25_0: "Отдать чашку Харрису"
STR_INTERCEPT_CHOICE_25_1: "Прижать Хупера чашкой"
STR_INTERCEPT_TITLE_26: "ЛОЖНАЯ МИШЕНЬ"
STR_INTERCEPT_TEXT_26: "Вы обвиняете Харриса без доказательств. Для него вы — загнанный в угол шпион, пытающийся очернить следствие. Доверие к вам потеряно."
STR_INTERCEPT_CHOICE_26_0: "Допрос окончен"
STR_INTERCEPT_TITLE_27: "ПОЛНАЯ КАРТИНА"
STR_INTERCEPT_TEXT_27: "Вы называете имена и описываете встречу. Харрис задаёт точные, сухие вопросы. Ваш стыд неподделен, но факты сходятся."
STR_INTERCEPT_CHOICE_27_0: "Дать ему проверить показания"
STR_INTERCEPT_CHOICE_27_1: "Предложить найти Хупера"
STR_INTERCEPT_TITLE_28: "НЕУДАЧНЫЙ БЛЕФ"
STR_INTERCEPT_TEXT_28: "Харрис сыт по горло самоуверенными байками. Хупер тоже. Ни один из них не подтверждает ваших пустых слов."
STR_INTERCEPT_CHOICE_28_0: "Стоять на своём"
STR_INTERCEPT_CHOICE_28_1: "Бежать любой ценой"
STR_INTERCEPT_CHOICE_28_2: "Признаться в правде"
STR_INTERCEPT_TITLE_29: "ПЕРЕХВАТ"
STR_INTERCEPT_TEXT_29: "Листок в кармане содержит не просто шифр: маршрут курьера указывает на присутствие Хупера у зала «Бомбы». Чёткий намёк укажет следователю верное направление."
STR_INTERCEPT_CHOICE_29_0: "Зашифровать послание Хуперу"
STR_INTERCEPT_CHOICE_29_1: "Показать маршрут Харрису"
STR_INTERCEPT_TITLE_30: "МАШИНА РАБОТАЕТ"
STR_INTERCEPT_TEXT_30: "У Харриса в руках барабан и ниточка, ведущая к настоящим организаторам. «Бомба» снова в строю. Вы покидаете барак 14 со своим добрым именем."
STR_INTERCEPT_TITLE_31: "ПОД ПОДОЗРЕНИЕМ"
STR_INTERCEPT_TEXT_31: "Возврат детали спас работу машины, но не вашу должность. Допуск аннулирован до завершения расследования. Вы свободны, но тень подозрения осталась."
STR_INTERCEPT_TITLE_32: "ПОД АРЕСТОМ"
STR_INTERCEPT_TEXT_32: "Дверь распахивается не для свободы, а для конвоя. Противоречия, нестыковки и факт кражи сложились в дело, которое вам уже не исправить. Финал."
STR_INTERCEPT_TITLE_33: "ВНЕШНЯЯ ТРОПА"
STR_INTERCEPT_TEXT_33: "Бараки скрываются в темноте. Ночь на руку, но территория патрулируется. Звон разбитого стекла пригнал патрули ближе, чем хотелось бы."
STR_INTERCEPT_CHOICE_33_0: "Пересечь открытое поле"
STR_INTERCEPT_CHOICE_33_1: "Держаться служебной тропы"
STR_INTERCEPT_CHOICE_33_2: "Вернуться к Харрису"
STR_INTERCEPT_TITLE_34: "БАРАК ХУПЕРА"
STR_INTERCEPT_TEXT_34: "Стол пуст. Под кроссвордом лежат документы, а зал «Бомбы» значится в рукописном плане. По доскам снаружи приближаются чьи-то шаги."
STR_INTERCEPT_CHOICE_34_0: "Осмотреть бумаги"
STR_INTERCEPT_CHOICE_34_1: "Дождаться Хупера"
STR_INTERCEPT_CHOICE_34_2: "Идти с бумагами к Харрису"
STR_INTERCEPT_TITLE_35: "ШАХМАТНЫЙ ЭТЮД"
STR_INTERCEPT_TEXT_35: "Вы предлагаете позицию, зеркалящую его положение: фигура под боем, открытый король и ход, кажущийся спасительным. Он понимает предупреждение и сдаётся."
STR_INTERCEPT_CHOICE_35_0: "Потребовать признания"
STR_INTERCEPT_CHOICE_35_1: "Передать признание Харрису"
STR_INTERCEPT_TITLE_36: "БЕЗ МАСОК"
STR_INTERCEPT_TEXT_36: "Вы говорите о шантаже открыто. Хупер на миг забывает роль противника и отвечает искренне. Этот момент можно обратить в союз или в ловушку."
STR_INTERCEPT_CHOICE_36_0: "Предложить честный договор"
STR_INTERCEPT_CHOICE_36_1: "Потребовать явки с повинной"
STR_INTERCEPT_CHOICE_36_2: "Идти с повинной к Харрису"
STR_INTERCEPT_TITLE_37: "ПРИЗНАНИЕ ХУПЕРА"
STR_INTERCEPT_TEXT_37: "Хупер признаёт шантаж и связь с похищением. Теперь Харрис сможет восстановить картину. Решать вам: передать дело следователю или отпустить Хупера."
STR_INTERCEPT_CHOICE_37_0: "Отдать признание Харрису"
STR_INTERCEPT_CHOICE_37_1: "Отпустить Хупера и уйти"
STR_INTERCEPT_TITLE_38: "СДЕЛКА"
STR_INTERCEPT_TEXT_38: "Вы отдаёте свой главный козырь. Сделка без свидетелей — верный способ позволить Хуперу решить свои проблемы за ваш счёт."
STR_INTERCEPT_CHOICE_38_0: "Передать барабан Хуперу"
STR_INTERCEPT_CHOICE_38_1: "Потребовать соглашения при свидетелях"
STR_INTERCEPT_CHOICE_38_2: "Отозвать предложение"
STR_INTERCEPT_TITLE_39: "ХАРРИС СЛУШАЕТ"
STR_INTERCEPT_TEXT_39: "Факты можно перепроверить. Харрис спрашивает, где деталь сейчас. Оправдать себя и запустить машину — две стороны одной задачи."
STR_INTERCEPT_CHOICE_39_0: "Вернуть барабан из кармана"
STR_INTERCEPT_CHOICE_39_1: "Помочь изъять деталь"
STR_INTERCEPT_CHOICE_39_2: "Прекратить давать показания"
STR_INTERCEPT_TITLE_40: "ЗА ОГРАДОЙ"
STR_INTERCEPT_TEXT_40: "Огни бараков исчезают за спиной. Свобода за периметром — ещё не невиновность, а запуск машины теперь забота других. Вы спаслись, но страница осталась незакрытой."
STR_INTERCEPT_TITLE_41: "ПОСЛЕДНЯЯ ОШИБКА"
STR_INTERCEPT_TEXT_41: "Патруль настигает вас в поле, либо обещания Хупера рассыпаются, как только вы перестали быть полезны. Безопасных ходов больше нет. Попробуйте снова."
STR_INTERCEPT_TITLE_42: "БУМАГИ"
STR_INTERCEPT_TEXT_42: "Расписание дежурств помещает Хупера ровно туда, где его видели. Рядом лежит записка шантажиста. Этой связки фактов Харрису будет достаточно."
STR_INTERCEPT_CHOICE_42_0: "Отнести бумаги Харрису"
STR_INTERCEPT_CHOICE_42_1: "Дождаться Хупера"
STR_INTERCEPT_TITLE_43: "ПОСЛЕДНИЙ ДОГОВОР"
STR_INTERCEPT_TEXT_43: "Хупер предлагает незаметно вернуть деталь на место. Довериться ему — решить минутную проблему; привлечь Харриса — исключить новую ложь."
STR_INTERCEPT_CHOICE_43_0: "Организовать возврат при свидетелях"
STR_INTERCEPT_CHOICE_43_1: "Посвятить Харриса в план"
STR_INTERCEPT_TITLE_44: "ВОЗВРАТ БАРАБАНА"
STR_INTERCEPT_TEXT_44: "Показания запротоколированы, поиски возвращаются к «Бомбе». Харрис осматривает зал, пока вы указываете место установки детали."
STR_INTERCEPT_CHOICE_44_0: "Завершить возврат детали"
STR_INTERCEPT_CHOICE_44_1: "Достать деталь из пальто"
STR_INTERCEPT_CHOICE_44_2: "Предостеречь о Хупере"
STR_INTERCEPT_TITLE_45: "ФИНАЛЬНЫЙ ВОПРОС"
STR_INTERCEPT_TEXT_45: "Харрис ждёт. Если вы свяжете кражу с Хупером, есть шанс вернуть барабан и закрыть дело достойно. Иначе останутся лишь ваши путаные показания."
STR_INTERCEPT_CHOICE_45_0: "Предъявить все доказательства"
STR_INTERCEPT_CHOICE_45_1: "Признать, что сказать больше нечего"
